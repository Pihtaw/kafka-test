# конфиг для Redpanda: копирует из tools-topic в copy-topic ТОЛЬКО сообщения с заголовком eventType=OrderCreated.
# docker compose run --rm connect
input:
  redpanda:
    seed_brokers: ["kafka:19092"]
    topics: ["tools-topic"]
    consumer_group: "connect-test"   # читает как участник группы и коммитит offsets
    start_offset: earliest

pipeline:
  processors:
    - mapping: |
        # @eventType — заголовок сообщения; content() — тело как есть, байт в байт; deleted() — выбросить
        root = if @eventType == "OrderCreated" { content() } else { deleted() }

output:
  redpanda:
    seed_brokers: ["kafka:19092"]
    topic: copy-topic
    key: ${! @kafka_key }
    metadata:
      include_patterns: ["^eventType$", "^version$"]   # какие заголовки перенести
